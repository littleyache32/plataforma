name: Homologacao Fase 4 PostgreSQL 17
on:
  push:
    branches: [ci-homologacao-fase4]
permissions:
  contents: read
jobs:
  postgres-real:
    if: github.ref == 'refs/heads/ci-homologacao-fase4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_review
          POSTGRES_PASSWORD: disposable_review_only
          POSTGRES_DB: plataforma_review_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_review -d plataforma_review_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      postgrest:
        image: postgrest/postgrest:v12.2.3
        env:
          PGRST_DB_URI: postgresql://ci_review:disposable_review_only@postgres:5432/plataforma_review_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: disposable_ci_jwt_secret_not_used_outside_this_job_0123456789
        ports: ['3000:3000']
    env:
      REVIEW_TEST_DATABASE_URL: postgresql://ci_review:disposable_review_only@127.0.0.1:5432/plataforma_review_test
      REVIEW_TEST_POSTGREST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migration, ledger, rollback, concorrencia e fluxo HTTP autenticado reais
        run: node --test tests/review-postgres-ci.test.js
