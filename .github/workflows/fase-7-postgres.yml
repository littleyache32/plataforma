name: Fase 7.3C PostgreSQL isolado

on:
  push:
    branches: [test/fase-7-postgres]

permissions:
  contents: read

jobs:
  postgres-real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_timer
          POSTGRES_PASSWORD: ci_only_disposable
          POSTGRES_DB: plataforma_timer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_timer -d plataforma_timer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TIMER_TEST_DATABASE_URL: postgresql://ci_timer:ci_only_disposable@127.0.0.1:5432/plataforma_timer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências sem scripts de aplicação
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirmar versão do PostgreSQL efêmero
        run: docker exec "${{ job.services.postgres.id }}" psql -U ci_timer -d plataforma_timer_test -c 'select version();'
      - name: Schema real necessário, migration 0069 e nove testes PostgreSQL
        # The existing test setup extracts real table DDLs, applies 0069,
        # and cleans only its random schema. No seed, production or deployment.
        run: npm test -- --run tests/timer-duration-postgres.test.js --testNamePattern 'PostgreSQL real:'
